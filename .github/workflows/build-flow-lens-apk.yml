name: Build BNB Flow Lens APK

on:
  workflow_dispatch:
  push:
    branches: [ "flow-lens-android" ]
    paths:
      - "flow-lens/android/**"
      - ".github/workflows/build-flow-lens-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore stable dev signing key
        run: base64 --decode flow-lens/android/flow-lens-dev.jks.b64 > flow-lens/android/flow-lens-dev.jks

      - name: Build compatibility APK
        run: gradle -p flow-lens/android :app:assembleDebug

      - name: Verify Android signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose flow-lens/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BNB-Flow-Lens-Compat-v1.1.1
          path: flow-lens/android/app/build/outputs/apk/debug/app-debug.apk
