name: Build BNB Flow Lens APK

on:
  workflow_dispatch:
  push:
    branches: [ "flow-lens-android" ]
    paths:
      - "flow-lens/BNB-Flow-Lens-Android-v1.1.zip.b64"
      - ".github/workflows/build-flow-lens-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decode and unpack Flow Lens v1.1
        run: |
          rm -rf extracted
          mkdir extracted
          base64 --decode --ignore-garbage flow-lens/BNB-Flow-Lens-Android-v1.1.zip.b64 > flow-lens-v1.1.zip
          unzip -t flow-lens-v1.1.zip
          unzip -q flow-lens-v1.1.zip -d extracted

      - name: Build APK
        run: gradle -p extracted/BNB-Flow-Lens-Android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BNB-Flow-Lens-APK-v1.1
          path: extracted/BNB-Flow-Lens-Android/app/build/outputs/apk/debug/app-debug.apk
