name: Build BNB Flow Lens APK

on:
  workflow_dispatch:
  push:
    branches: [ "flow-lens-android" ]
    paths:
      - "flow-lens/android/**"
      - ".github/workflows/build-flow-lens-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build unsigned APK
        run: gradle -p flow-lens/android :app:assembleRelease

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: BNB-Flow-Lens-Unsigned-v1.1
          path: flow-lens/android/app/build/outputs/apk/release/app-release-unsigned.apk
