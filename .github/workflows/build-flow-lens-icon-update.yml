name: Build BNB Flow Lens Icon Update

on:
  workflow_dispatch:
  push:
    branches: [ "flow-lens-android" ]
    paths:
      - "flow-lens/android/app/src/debug/**"
      - ".github/workflows/build-flow-lens-icon-update.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore stable dev signing key
        run: base64 --decode flow-lens/android/flow-lens-dev.jks.b64 > flow-lens/android/flow-lens-dev.jks

      - name: Bump icon-only build version
        run: |
          sed -i -E 's/versionCode = [0-9]+/versionCode = 7/' flow-lens/android/app/build.gradle.kts
          sed -i -E 's/versionName = "[^"]+"/versionName = "1.3.2"/' flow-lens/android/app/build.gradle.kts

      - name: Build APK
        run: gradle -p flow-lens/android :app:assembleDebug

      - name: Verify package version
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging flow-lens/android/app/build/outputs/apk/debug/app-debug.apk | head -n 3
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging flow-lens/android/app/build/outputs/apk/debug/app-debug.apk | grep "application: label='BNB Flow Lens'"

      - name: Verify stable Android signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs flow-lens/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BNB-Flow-Lens-v1.3.2-icon
          path: flow-lens/android/app/build/outputs/apk/debug/app-debug.apk
